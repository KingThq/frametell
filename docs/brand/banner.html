<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Frametell banner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Noto+Serif+SC:wght@600;700;900&family=Playfair+Display:ital,wght@1,500;1,600&display=swap">
<style>
/* 1280 × 640 README / social preview banner. ?lang=en|zh  ?theme=dark|light */
:root {
  --bg: #0C0A09; --card: #181513; --card-2: #1F1C19; --ink: #F5F5F4; --ink-2: #B0A9A3; --ink-3: #8F8780;
  --line: #292522; --line-2: #3D3834; --accent: #E0B88A; --accent-ink: #E4C096; --page: #EFE6D6; --page-ink: #2B2622;
  --f-cn: "Noto Serif SC", "Songti SC", serif; --f-ui: Inter, "PingFang SC", system-ui, sans-serif; --f-mark: "Playfair Display", Georgia, serif;
}
:root.light {
  --bg: #F5F5F0; --card: #FFFFFF; --card-2: #FAF8F3; --ink: #1C1917; --ink-2: #57534E; --ink-3: #7A736C;
  --line: #E7E5E2; --line-2: #D6D3CF; --accent: #C9935C; --accent-ink: #9C6A3A; --page: #EFE6D6; --page-ink: #2B2622;
}
* { box-sizing: border-box; }
p { margin: 0; }
html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--f-ui); -webkit-font-smoothing: antialiased; }
.b { position: relative; width: 1280px; height: 640px; display: grid; grid-template-columns: 560px 1fr; align-items: center; padding: 0 80px; gap: 56px; }

.left { display: flex; flex-direction: column; gap: 30px; }
.lockup { display: flex; align-items: center; gap: 22px; }
.lockup svg { width: 76px; height: 76px; }
.lockup .cn { font: 700 72px/1 var(--f-cn); letter-spacing: .06em; }
.lockup .en { font: italic 500 34px/1 var(--f-mark); letter-spacing: -.01em; color: var(--ink-2); border-left: 1px solid var(--line-2); padding: 8px 0 12px 22px; }
.tag { font: 600 40px/1.3 var(--f-cn); letter-spacing: .02em; color: var(--ink); }
.tag em { display: block; font-style: normal; color: var(--accent-ink); }
:root[lang="en"] .tag { font: 600 42px/1.08 var(--f-ui); letter-spacing: -.03em; }
/* one voice for both lines, as in the Chinese banner: the italic serif belongs to the wordmark alone */
:root[lang="en"] .tag em { font: inherit; letter-spacing: inherit; }
/* the English banner carries no Chinese: Frametell alone is the wordmark — always written Frametell, never in capitals */
:root[lang="en"] .lockup .cn { display: none; }
:root[lang="en"] .lockup .en { font: italic 600 68px/1 var(--f-mark); letter-spacing: -.015em; color: var(--ink); border-left: 0; padding: 0 0 8px; }
.sub { font-size: 17px; line-height: 1.6; color: var(--ink-2); max-width: 30em; }
.chips { display: flex; gap: 10px; flex-wrap: wrap; }
.chips span { font: 500 14px var(--f-ui); color: var(--ink-2); border: 1px solid var(--line-2); border-radius: 99px; padding: 6px 14px; }

.right { position: relative; display: flex; flex-direction: column; gap: 38px; }
.frame { position: relative; aspect-ratio: 16 / 9; }
.screen { position: absolute; inset: 0; border-radius: 10px; background: var(--page); overflow: hidden; display: grid; place-items: center; }
.screen .t { font: 900 34px/1.35 var(--f-cn); color: var(--page-ink); text-align: center; letter-spacing: .06em; }
.screen .t small { display: block; font: 500 13px var(--f-ui); letter-spacing: .14em; color: #6E645B; margin-top: 6px; }
.screen .coin { position: absolute; left: 30px; top: 26px; width: 52px; height: 52px; border-radius: 50%; background: #C9A26B; box-shadow: inset 0 0 0 5px #B48A52; display: grid; place-items: center; }
.screen .coin::after { content: ""; width: 14px; height: 14px; background: #EFE6D6; }
.screen .coin.two { left: 66px; top: 50px; transform: scale(.75); opacity: .9; }
/* the English page is about the sky, so a low sun stands where the Chinese page has its coins */
.screen .sun { display: none; position: absolute; left: 34px; top: 28px; width: 48px; height: 48px; border-radius: 50%; background: #D9A54E; box-shadow: 0 0 0 10px rgb(217 165 78 / .22), 0 0 0 22px rgb(217 165 78 / .1); }
:root[lang="en"] .screen .coin { display: none; }
:root[lang="en"] .screen .sun { display: block; }
.screen .subt { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); background: rgb(12 10 9 / .74); color: #F5F5F4; font: 500 14px var(--f-ui); padding: 4px 12px; border-radius: 5px; white-space: nowrap; }
.corner { position: absolute; width: 56px; height: 56px; border-color: var(--accent); border-style: solid; }
.corner.tl { left: -22px; top: -22px; border-width: 9px 0 0 9px; }
.corner.br { right: -22px; bottom: -22px; border-width: 0 9px 9px 0; }
.rec { position: absolute; right: 16px; top: 14px; display: flex; align-items: center; gap: 7px; font: 500 12px "JetBrains Mono", monospace; color: #6E645B; }
.rec i { width: 10px; height: 10px; border-radius: 50%; background: #C9935C; }

.lane { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.lane div { aspect-ratio: 16 / 9; border-radius: 5px; background: var(--card); border: 1px solid var(--line); }
.lane .done { background: var(--page); border-color: transparent; opacity: .8; }
.lane .now { border: 1.5px solid var(--accent); background: var(--card-2); }
.lane .queue { border: 1px dashed var(--line-2); background: transparent; }
.lane-cap { margin-top: -24px; display: flex; justify-content: space-between; font: 500 12px "JetBrains Mono", monospace; color: var(--ink-3); }
.lane-cap b { color: var(--accent); font-weight: 500; }
</style>
</head>
<body>
<div class="b">
  <div class="left">
    <div class="lockup">
      <svg viewBox="0 0 64 64"><path style="fill:var(--ink)" d="M8 8H31V14.5H14.5V31H8Z"/><path style="fill:var(--ink)" d="M56 56H33V49.5H49.5V33H56Z"/><circle style="fill:var(--accent)" cx="32" cy="32" r="7.5"/></svg>
      <span class="cn">帧言</span><span class="en">Frametell</span>
    </div>
    <p class="tag" data-zh="帧帧有言<em>把想法和资料讲成片</em>" data-en="Tell stories,<em>frame by frame.</em>"></p>
    <p class="sub" data-zh="一句灵感、一份文档都能开始。导演 Agent 先出分镜给你拍板，再写口播、配音、逐页作画并自检，最后渲染成 1080p 成片。" data-en="Start from one sentence or a stack of notes. A director agent drafts the storyboard for your sign-off, then writes, voices and draws every page into a 1080p video."></p>
    <div class="chips" data-zh="开源|本地运行|任何模型" data-en="Open source|Runs locally|Any model"></div>
  </div>
  <div class="right">
    <div class="frame">
      <div class="screen">
        <div class="coin"></div><div class="coin two"></div><div class="sun"></div>
        <p class="t" data-zh="宋朝的钱，为什么不够用？<small>第 3 页 · 钱荒</small>" data-en="Why is the sky blue?<small>PAGE 3 · RAYLEIGH SCATTERING</small>"></p>
        <span class="subt" data-zh="朝廷发现，铜不够用了。" data-en="Air scatters blue light far more than red."></span>
        <span class="rec"><i></i>00:42</span>
      </div>
      <span class="corner tl"></span><span class="corner br"></span>
    </div>
    <div class="lane"><div class="done"></div><div class="done"></div><div class="now"></div><div class="queue"></div><div class="queue"></div><div class="queue"></div></div>
    <div class="lane-cap" data-zh="<span>分镜 6 页</span><b>正在画第 3 页</b>" data-en="<span>6-page storyboard</span><b>Drawing page 3</b>"></div>
  </div>
</div>
<script>
  var q = new URLSearchParams(location.search);
  var lang = q.get('lang') === 'en' ? 'en' : 'zh';
  document.documentElement.lang = lang;
  if (q.get('theme') === 'light') document.documentElement.classList.add('light');
  document.querySelectorAll('[data-zh]').forEach(function (el) {
    var v = el.getAttribute('data-' + lang);
    if (el.classList.contains('chips')) el.innerHTML = v.split('|').map(function (s) { return '<span>' + s + '</span>'; }).join('');
    else el.innerHTML = v;
  });
</script>
</body>
</html>
