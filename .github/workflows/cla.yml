# Asks every outside contributor to accept CLA.md once, by commenting on their pull request; the signatures are kept
# in signatures/cla.json on the cla-signatures branch. pull_request_target runs this workflow from main with write
# access, so it must never check out or run the pull request's code: it only reads comments and writes the signature.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/sitor-ai/frametell/blob/main/CLA.md
          branch: cla-signatures
          allowlist: sanyuan0704,dependabot[bot],github-actions[bot],renovate[bot]
          lock-pullrequest-aftermerge: true
          custom-notsigned-prcomment: >-
            Thank you for your contribution. Before we can merge it, please read our
            [Contributor License Agreement](https://github.com/sitor-ai/frametell/blob/main/CLA.md) and accept it by
            commenting below with the exact sentence that follows. You only need to do this once.
