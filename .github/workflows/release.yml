name: Release

# Pushing a tag like v0.1.2 builds the macOS app, signs it with the Developer ID, has Apple notarize it, and opens a
# draft release with the dmg and the version's changelog section. Publish the draft by hand once it looks right.
#
# Repository secrets it needs:
#   MAC_CERT_P12         the "Developer ID Application" certificate with its private key, exported as .p12, base64
#   MAC_CERT_PASSWORD    the password the .p12 was exported with
#   APPLE_API_KEY_P8     an App Store Connect API key (.p8 file contents), for notarization
#   APPLE_API_KEY_ID     that key's ID
#   APPLE_API_ISSUER     the Issuer ID shown above the keys list

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  mac:
    name: macOS app
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Check the tag matches the version
        run: |
          v=$(node -p "require('./apps/desktop/package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, but apps/desktop is $v"; exit 1; }
          grep -q "^## \[$v\]" CHANGELOG.md || { echo "CHANGELOG.md has no [$v] section"; exit 1; }

      - run: pnpm install --frozen-lockfile

      - name: Import the signing certificate
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"; kcpass=$(openssl rand -hex 16)
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -P "$MAC_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          security set-key-partition-list -S apple-tool:,apple: -k "$kcpass" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$kc" | grep -q "Developer ID Application" || { echo "no Developer ID Application certificate in MAC_CERT_P12"; exit 1; }

      - name: Build, sign and notarize
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
        run: |
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY"
          pnpm package:desktop
          rm "$APPLE_API_KEY"

      - name: Check the download opens
        run: |
          dmg=$(ls apps/desktop/release/Frametell-*-arm64.dmg)
          spctl -a -vv -t open --context context:primary-signature "$dmg"
          spctl -a -vv apps/desktop/release/mac-arm64/Frametell.app
          xcrun stapler validate "$dmg"

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${GITHUB_REF_NAME#v}
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          printf '\n## Checksum\n\n```\n%s\n```\n' "$(cat apps/desktop/release/Frametell-$v-arm64.dmg.sha256)" >> notes.md
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "画说 · Frametell $v" --notes-file notes.md \
            "apps/desktop/release/Frametell-$v-arm64.dmg" "apps/desktop/release/Frametell-$v-arm64.dmg.sha256"

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
