name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The app version, or the commit if you built from source (`git rev-parse --short HEAD`).
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where you run it
      options:
        - Desktop app (macOS)
        - Desktop app (Windows)
        - Browser (frametell serve)
        - Command line (frametell run)
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model and voice provider
      placeholder: e.g. Claude Sonnet via OpenRouter, Volcengine TTS
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Any error text, or the project's log. Please remove API keys first.
      render: text
